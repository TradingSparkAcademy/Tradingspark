<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Spark Academy | Iniciar Sesión</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../js/i18n.js"></script>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">TSA</div><div class="nav-logo-text">TSA <span>Trading</span></div></a>
      <ul class="nav-links">
        <li><a href="../index.html" data-i18n="nav.home">Inicio</a></li>
        <li><a href="about.html" data-i18n="nav.about">Nosotros</a></li>
        <li><a href="courses.html" data-i18n="nav.courses">Cursos</a></li>
        <li><a href="plans.html" data-i18n="nav.pricing">Precios</a></li>
        <li><a href="testimonials.html" data-i18n="nav.reviews">Reseñas</a></li>
        <li><a href="contact.html" data-i18n="nav.contact">Contacto</a></li>
      </ul>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-gold btn-sm" data-i18n="nav.getstarted">Comenzar</a>
      </div>
      <div class="mobile-toggle" id="mobileToggle"><span></span><span></span><span></span></div>
    </div>
  </nav>

  <section class="auth-page">
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="nav-logo-icon" style="width:56px;height:56px;font-size:1.5rem;margin:0 auto 20px;">TSA</div>
          <h2 data-i18n="login.title">Bienvenido de Vuelta</h2>
          <p data-i18n="login.subtitle">Inicia sesión para acceder a tu panel de trading</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" data-i18n="login.email">Correo Electrónico</label>
            <input type="email" class="form-input" data-i18n-ph="login.email.ph" placeholder="Ingresa tu correo" required>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="login.password">Contraseña</label>
            <input type="password" class="form-input" data-i18n-ph="login.password.ph" placeholder="Ingresa tu contraseña" required>
          </div>
          <div class="form-row">
            <label class="form-check"><input type="checkbox"> <span data-i18n="login.remember">Recuérdame</span></label>
            <a href="#" class="form-link" data-i18n="login.forgot">¿Olvidaste tu Contraseña?</a>
          </div>
          <button type="submit" class="btn btn-gold w-full" style="justify-content:center;" onclick="event.preventDefault(); window.location.href='dashboard.html';">
            <i class="fas fa-sign-in-alt"></i> <span data-i18n="login.btn">Iniciar Sesión</span>
          </button>
        </form>
        <div class="form-divider"><span data-i18n="login.or">o continúa con</span></div>
        <div class="social-login">
          <button class="social-login-btn"><i class="fab fa-google"></i></button>
          <button class="social-login-btn"><i class="fab fa-apple"></i></button>
          <button class="social-login-btn"><i class="fab fa-discord"></i></button>
        </div>
        <p style="text-align:center;margin-top:24px;font-size:0.9rem;">
          <span data-i18n="login.noaccount">¿No tienes cuenta?</span> <a href="register.html" class="form-link" data-i18n="login.signup">Regístrate</a>
        </p>
      </div>
    </div>
  </section>
  <script src="../js/main.js"></script>
</body>
</html>
