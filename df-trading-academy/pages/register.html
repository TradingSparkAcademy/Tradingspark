<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Spark Academy | Registro</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../js/i18n.js"></script>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><div class="nav-logo-icon">TSA</div><div class="nav-logo-text">TSA <span>Trading</span></div></a>
      <ul class="nav-links">
        <li><a href="../index.html" data-i18n="nav.home">Inicio</a></li>
        <li><a href="about.html" data-i18n="nav.about">Nosotros</a></li>
        <li><a href="courses.html" data-i18n="nav.courses">Cursos</a></li>
        <li><a href="plans.html" data-i18n="nav.pricing">Precios</a></li>
        <li><a href="testimonials.html" data-i18n="nav.reviews">Reseñas</a></li>
        <li><a href="contact.html" data-i18n="nav.contact">Contacto</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="nav-btn-login" data-i18n="nav.signin">Iniciar Sesión</a>
      </div>
      <div class="mobile-toggle" id="mobileToggle"><span></span><span></span><span></span></div>
    </div>
  </nav>

  <section class="auth-page">
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="nav-logo-icon" style="width:56px;height:56px;font-size:1.5rem;margin:0 auto 20px;">TSA</div>
          <h2 data-i18n="register.title">Únete a la Élite</h2>
          <p data-i18n="register.subtitle">Crea tu cuenta y comienza a operar como un profesional</p>
        </div>
        <form id="registerForm">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label class="form-label" data-i18n="register.firstname">Nombre</label>
              <input type="text" class="form-input" placeholder="John" required>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="register.lastname">Apellido</label>
              <input type="text" class="form-input" placeholder="Doe" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="register.email">Correo Electrónico</label>
            <input type="email" class="form-input" placeholder="john@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="register.password">Contraseña</label>
            <input type="password" class="form-input" data-i18n-ph="register.password.ph" placeholder="Mín. 8 caracteres" required>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="register.plan">Seleccionar Plan</label>
            <select class="form-input" style="cursor:pointer;">
              <option value="basic" data-i18n="register.plan.basic">Plan Básico - $30/mes</option>
              <option value="pro" selected data-i18n="register.plan.pro">Plan Pro - $50/mes (Recomendado)</option>
              <option value="vip" data-i18n="register.plan.vip">VIP Élite - $100/mes</option>
            </select>
          </div>
          <div style="margin-bottom:24px;">
            <label class="form-check">
              <input type="checkbox" required> <span data-i18n="register.agree">Acepto los</span> <a href="#" class="form-link" data-i18n="register.terms">Términos de Servicio</a> <span data-i18n="register.and">y</span> <a href="#" class="form-link" data-i18n="register.privacy">Política de Privacidad</a>
            </label>
          </div>
          <button type="submit" class="btn btn-gold w-full" style="justify-content:center;" onclick="event.preventDefault(); window.location.href='dashboard.html';">
            <i class="fas fa-rocket"></i> <span data-i18n="register.btn">Crear Cuenta y Suscribirse</span>
          </button>
          <p style="text-align:center;margin-top:12px;font-size:0.8rem;color:var(--white-30);">
            <i class="fas fa-lock"></i> <span data-i18n="register.secure">Protegido por Stripe • Encriptación SSL 256-bit</span>
          </p>
        </form>
        <div class="form-divider"><span data-i18n="register.or">o regístrate con</span></div>
        <div class="social-login">
          <button class="social-login-btn"><i class="fab fa-google"></i></button>
          <button class="social-login-btn"><i class="fab fa-apple"></i></button>
          <button class="social-login-btn"><i class="fab fa-discord"></i></button>
        </div>
        <p style="text-align:center;margin-top:24px;font-size:0.9rem;">
          <span data-i18n="register.hasaccount">¿Ya tienes cuenta?</span> <a href="login.html" class="form-link" data-i18n="register.signin">Iniciar Sesión</a>
        </p>
      </div>
    </div>
  </section>
  <script src="../js/main.js"></script>
</body>
</html>
